name: Update years of experience

on:
  schedule:
    - cron: "0 0 1 * *" # 1st of every month, 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate years since 2023.07
        env:
          CAREER_START: "2023-07"
        run: python3 .github/scripts/update_years.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update years of experience"
          git push
